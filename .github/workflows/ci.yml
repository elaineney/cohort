name: Cohort

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['22']
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the Compact toolchain at version 0.35.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update 0.35.0

      - name: Build the contract with proving and verifier keys
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          compact compile contract/src/cohort.compact "$target"
          [ -d "$target/keys" ]

      - name: Make sure the committed JavaScript matches the source
        run: |
          set -euo pipefail
          fresh="$(mktemp -d)"
          compact compile --skip-zk contract/src/cohort.compact "$fresh"
          diff -r -x '*.map' "$fresh/contract" contract/src/managed/cohort/contract

      - name: Install npm packages
        run: npm ci

      - name: Type-check everything
        run: npm run typecheck

      - name: Run the test suites
        run: npm test

      - name: Walk through the recruitment demo
        run: npm run demo

      - name: Build the website
        run: npm run build:web

      - name: Stage website artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish trial portal
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
